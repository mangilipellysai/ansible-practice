- name: Install Nginx
  hosts: frontend
  become: yes
  tasks:
  - name: intsall nginx server
    ansible.builtin.package:
      name: nginx
      state: present


- name: nginx start
  hosts: frontend
  become: yes
  tasks:
  - name: start nginx service
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes